[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firestick-controller"
version = "0.1.0"
description = "A local-network Fire TV controller using Android Debug Bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
firestick-controller = "firestick_controller.main:main"
firestick-controller-gui = "firestick_controller.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]